[build]
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Proxy Firebase Auth handler through the app's own domain so Safari
# doesn't treat auth tokens as third-party (fixes CORS/ITP issues).
[[redirects]]
  from = "/__/auth/*"
  to = "https://junklisting-aa1db.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
