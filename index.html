<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JunkLister</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>

  <!-- Auth -->
  <div id="authScreen" class="auth">
    <div class="auth-logo">Junk<span>Lister</span></div>
    <p class="auth-tagline">snap · sort · sell</p>
    <button id="googleSignInBtn" class="btn-signin" type="button">Continue with Google</button>
    <p id="authErr" class="auth-error"></p>
  </div>

  <!-- App -->
  <div id="app" class="app" hidden>
    <header class="header">
      <span class="header-logo">Junk<span>Lister</span></span>
      <div class="header-right">
        <img id="userAvatar" class="avatar" alt="" hidden>
        <button id="signOutBtn" class="btn-text" type="button">Sign Out</button>
      </div>
    </header>

    <div id="dropzone" class="upload" tabindex="0" role="button" aria-label="Upload images">
      <span class="upload-icon">+</span>
      <span class="upload-text">Add Photos</span>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>

    <div id="progressBar" class="progress" hidden>
      <div id="progressFill" class="progress-fill"></div>
    </div>

    <div id="actionBar" class="action-bar" hidden>
      <button id="deselectBtn" class="btn-action" type="button">Cancel</button>
      <button id="mergeBtn" class="btn-action btn-gold" type="button">Merge</button>
      <button id="deleteBtn" class="btn-action btn-danger" type="button">Delete</button>
    </div>

    <div id="listings" class="listings"></div>

    <div id="emptyState" class="empty">
      <p class="empty-title">No listings yet</p>
      <p class="empty-sub">Upload photos to get started</p>
    </div>
  </div>

  <!-- Detail sheet -->
  <div id="sheet" class="sheet-overlay" hidden>
    <div class="sheet-backdrop"></div>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <header class="sheet-header">
        <button id="sheetClose" class="btn-text" type="button">Done</button>
        <span class="sheet-title" id="sheetTitle">Listing</span>
        <button id="sheetDownloadAll" class="btn-text" type="button">Save All</button>
      </header>

      <div id="sheetImages" class="sheet-images"></div>

      <div id="sheetAnalysis" class="sheet-analysis" hidden>
        <input id="sheetTitleInput" class="sheet-input sheet-input-title" placeholder="Title" autocomplete="off">
        <div class="sheet-row">
          <input id="sheetPrice" class="sheet-input sheet-input-price" placeholder="$" type="number" min="0">
          <span id="sheetCategory" class="sheet-badge"></span>
        </div>
        <textarea id="sheetDesc" class="sheet-input sheet-input-desc" placeholder="Description" rows="3"></textarea>
      </div>

      <div class="sheet-actions">
        <button id="sheetRemoveBtn" class="btn-action" type="button" hidden>Remove Selected</button>
        <button id="sheetReanalyze" class="btn-action btn-gold" type="button">Re-analyze</button>
        <button id="sheetDeleteGroup" class="btn-action btn-danger" type="button">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
